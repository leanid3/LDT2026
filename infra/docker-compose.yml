networks:
  inspector-net:
    name: inspector-net

volumes:
  pgdata:
  miniodata:
  kafkadata:
  grafanadata:

services:
  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inspector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inspector"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [inspector-net]

  # ------------------------------------------------------------------ minio
  # minio/minio и minio/mc удалены с Docker Hub (MinIO перестал публиковать готовые образы), quay.io/minio
  # требует авторизации. cgr.dev/chainguard/minio — MinIO, собранный из исходников Chainguard (анонимный pull).
  # Образ distroless: нет shell/mc, поэтому нет ни healthcheck через `mc ready`, ни контейнера-создателя
  # бакетов — бакет создаёт сам backend (internal/platform/minio) и Python-воркеры при старте.
  # user: root — чтобы именованный том был доступен на запись (в образе работает от uid 65532).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks: [inspector-net]

  # ------------------------------------------------------------------ kafka
  # KRaft single-node (без ZooKeeper). PLAINTEXT — для контейнеров (kafka:9092),
  # EXTERNAL — для хоста (localhost:9092, backend работает локально через `make run-api`).
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node KRaft: дефолтный replication factor для внутренних топиков — 3, но брокер один.
      # Без этого __consumer_offsets/__transaction_state не создаются вообще — ни один consumer group
      # не может закоммитить offset (обнаружено при первом реальном сквозном прогоне с M1: до этого
      # кластер проверялся только по списку топиков в kafka-ui, ни разу не гонялся настоящий consumer).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [inspector-net]

  # Топики раздела 6.2 backend-plan.md: 3 партиции/7д для рабочих топиков, 1 партиция/30д для DLQ.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        BS=kafka:9092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BS" --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1 \
            --config "retention.ms=$$3"
        }
        WEEK=604800000
        MONTH=2592000000
        for t in doc.parse.requested doc.parse.completed doc.extract.requested doc.extract.completed protocol.ready rin.sync.requested; do
          create "$$t" 3 "$$WEEK"
        done
        for t in doc.parse.requested.dlq doc.parse.completed.dlq doc.extract.requested.dlq doc.extract.completed.dlq rin.sync.requested.dlq; do
          create "$$t" 1 "$$MONTH"
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BS" --list
    networks: [inspector-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: inspector
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    networks: [inspector-net]

  # ------------------------------------------------------------------ redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [inspector-net]

  # ----------------------------------------------------------------- clamav
  clamav:
    image: clamav/clamav:1.5
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s # первый старт качает базы сигнатур
    networks: [inspector-net]

  # -------------------------------------------------------------- gotenberg
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    networks: [inspector-net]

  # ------------------------------------------------------------ prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [inspector-net]

  # --------------------------------------------------------------- grafana
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [inspector-net]

  # ---------------------------------------------------------- alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks: [inspector-net]

  # -------------------------------------------------------------- caddy
  # Реверс-прокси перед API (TLS терминация, backend-plan.md §10). На M0 backend работает на хосте
  # (`make run-api`), поэтому Caddy проксирует на host.docker.internal.
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8443:8443" # https -> proxied to backend api on the host (:8080, `make run-api`)
      - "8081:8080" # http, не 8080 хоста — чтобы не конфликтовать с локальным `make run-api`
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [inspector-net]
