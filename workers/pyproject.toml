[project]
name = "inspector-workers"
version = "0.1.0"
description = "Python-воркеры «Инспектора ИИ»: parse (документы -> layout) и extract (layout -> факты по Матрице)"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "pillow>=10"]
dev = ["pytest>=8", "reportlab>=4"]

[tool.setuptools.packages.find]
include = ["inspector_workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: требует docker (postgres/kafka/minio), пропускается без него"]
